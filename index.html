<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنجاز التسميع اليومي</title><style>
:root{--g:#063f32;--gold:#c69a3a;--iv:#f6eedb;--mist:#e6eeea}*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#123d34;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1300px;margin:auto;padding:18px}h1{margin:0;color:var(--g)}.controls{background:white;border:1px solid #d8e2dc;padding:20px;border-radius:18px;box-shadow:0 4px 16px #0000000a}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.hint{color:#64766d;font-size:14px}textarea{width:100%;min-height:118px;resize:vertical;border:1px solid #b9ccc3;border-radius:12px;padding:12px;font:14px Tahoma;direction:rtl}button,select,input{font:inherit}button{border:0;border-radius:10px;padding:11px 17px;cursor:pointer;background:var(--g);color:white}button.secondary{background:#e9eee9;color:var(--g)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}input[type=date]{border:1px solid #b9ccc3;border-radius:8px;padding:9px}#notice{font-size:13px;color:#526c5e}.entry{margin-top:15px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mini{border:1px solid #d9e6dc;border-radius:12px;padding:11px}.mini h3{margin:0 0 10px}.editrow{display:grid;grid-template-columns:100px minmax(0,1fr) 102px 88px;gap:5px;align-items:center;margin:6px 0;font-size:13px}.editrow input,.editrow select{min-width:0;width:100%;border:1px solid #d8dfdb;border-radius:6px;padding:8px;background:#fff}.editrow .nm{font-weight:bold}.preview{margin-top:20px;background:white;border:1px solid #ddd;border-radius:12px;padding:28px 22px 32px;box-shadow:0 3px 18px #00000010}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:35px}.brand{width:180px;text-align:center;color:var(--g);font-weight:bold;font-size:13px}.brand img{width:145px;max-width:100%;height:158px;display:block;margin:auto;object-fit:contain}.brand small{color:var(--gold)}.pagetitle{font-size:clamp(25px,3.5vw,52px);font-weight:900;color:var(--g);border-bottom:7px solid #e2bb65;padding-bottom:6px;white-space:nowrap}.datebox{border:1.5px solid var(--gold);border-radius:14px;padding:12px 18px;min-width:180px;line-height:2}.boards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.board{border:1.5px solid var(--gold);border-radius:18px;padding:32px 10px 15px;position:relative}.boardtitle{position:absolute;top:-25px;right:23%;left:23%;background:var(--g);color:white;border:2px solid var(--gold);border-radius:16px;text-align:center;font-weight:bold;font-size:clamp(19px,2.2vw,31px);padding:7px 0}.cols,.pupil{display:grid;grid-template-columns:29fr 39fr 16fr 16fr;gap:5px;margin:6px 0}.cell{border-radius:10px;background:var(--mist);min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px 4px;font-size:clamp(11px,1.35vw,18px);overflow-wrap:anywhere}.cols .cell{font-weight:800;background:#e4e9de}.cell.name{background:var(--iv);font-weight:700}.cell.completed{font-weight:800;font-size:clamp(14px,1.8vw,25px)}.success{background:#bbebc4;color:#07522a}.half{background:#ffd7a6;color:#854015}.fail{background:#f9c4c4;color:#991c1c}.joined{grid-column:2/5;background:#f7dede;color:#982525;font-size:22px;font-weight:800}.joined.dark{background:#60686b;color:white}.foot{color:#74827a;text-align:center;font-size:12px;margin-top:20px}@media(max-width:850px){.entry{grid-template-columns:1fr}.preview{overflow-x:auto;padding:18px 8px}.sheet{min-width:880px}.editrow{grid-template-columns:90px minmax(0,1fr) 95px 82px}}@media print{body{background:white}.controls,.foot{display:none!important}.wrap{padding:0;max-width:none}.preview{margin:0;border:0;box-shadow:none;padding:12px}.sheet{min-width:0}@page{size:A4 landscape;margin:6mm}}
</style></head><body><div class="wrap"><section class="controls"><div class="top"><div><h1>إنجاز التسميع اليومي</h1><div class="hint">انسخ نطاق يوم واحد من Google Sheets، والصقه هنا، ثم حدد إنجاز الطلاب يدويًا.</div></div><label>التاريخ <input type="date" id="date" value="2026-10-24"></label></div><p class="hint">يمكن لصق الجدول بأعمدة «الاسم | عدد الصفحات | السورة | التقييم»، أو بأي ترتيب تُكتشف فيه خانة الاسم. يمكن تعديل البيانات بعد الاستيراد.</p><textarea id="paste" placeholder="الصق خلايا Google Sheets هنا (Ctrl+V)"></textarea><div class="actions"><button id="import">استيراد البيانات</button><button class="secondary" id="reset">تفريغ بيانات اليوم</button><button class="secondary" onclick="window.print()">طباعة / حفظ PDF</button><span id="notice"></span></div><div class="entry" id="editors"></div></section><section class="preview"><div class="sheet"><header class="head"><div class="datebox">اليوم: <b id="dayName"></b><br>التاريخ: <b id="dayDate"></b></div><div class="pagetitle">إنجاز التسميع اليومي</div><div class="brand"><img alt="دار القرآن الكريم - مسجد فاطمة الزهراء" src="logo.png">
<script>
const groups=[['عمر مملوك','طالب','عبدالرحمن','عمر الخطيب','عبدالهادي',''],['أسامة','عزالدين','عبدالله','يوسف','محمد الخطيب','']];
let records={};const dayNames=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']; 
const norm=s=>(s||'').toString().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,'').trim();
function lookup(s){let n=norm(s); const aliases={'عمرملوك':'عمر مملوك','عمرالمملوك':'عمر مملوك','طالبعوده':'طالب','طالبعاصم':'طالب','عبدالرحمنالعظمات':'عبدالرحمن','عبدالرحمن عظمات':'عبدالرحمن','اسامهالبظ':'أسامة','اسامه':'أسامة','عزالدينقطامي':'عزالدين','عبداللهحجير':'عبدالله','عبدالله':'عبدالله','يوسفالخطيب':'يوسف','يوسف':'يوسف','محمدالخطيب':'محمد الخطيب'};if(aliases[n])return aliases[n];return groups.flat().find(x=>x&&norm(x)===n)||null}
const states=[['','— اختر —'],['100','100%'],['50','50%'],['X','X'],['0','0%'],['absent','غائب'],['blocked','-']];
function get(n){return records[n]||(records[n]={rec:'',eval:'',done:''})}
function update(n,key,v){get(n)[key]=v;renderPreview()}
function renderEditors(){let target=document.getElementById('editors');target.innerHTML='';groups.forEach((group,g)=>{let div=document.createElement('div');div.className='mini';div.innerHTML='<h3>المجموعة '+(g+1)+'</h3>';group.filter(Boolean).forEach(n=>{let r=get(n),line=document.createElement('div');line.className='editrow';let nm=document.createElement('span');nm.className='nm';nm.textContent=n;let rec=document.createElement('input');rec.placeholder='التسميع';rec.value=r.rec;rec.oninput=()=>update(n,'rec',rec.value);let ev=document.createElement('input');ev.placeholder='التقييم';ev.value=r.eval;ev.oninput=()=>update(n,'eval',ev.value);let sel=document.createElement('select');states.forEach(([v,t])=>sel.add(new Option(t,v)));sel.value=r.done;sel.onchange=()=>update(n,'done',sel.value);line.append(nm,rec,ev,sel);div.append(line)});target.append(div)})}
function cell(text,cls=''){let el=document.createElement('div');el.className='cell '+cls;el.textContent=text;return el}
function renderPreview(){const d=document.getElementById('date').value;let dt=new Date(d+'T12:00:00');document.getElementById('dayName').textContent=isNaN(dt)?'':dayNames[dt.getDay()];document.getElementById('dayDate').textContent=d?Number(d.slice(5,7))+' / '+Number(d.slice(8,10)):'';let area=document.getElementById('boards');area.innerHTML='';groups.forEach((group,g)=>{let board=document.createElement('article');board.className='board';let title=document.createElement('div');title.className='boardtitle';title.textContent='المجموعة '+(g+1);board.append(title);let heads=document.createElement('div');heads.className='cols';['الاسم','التسميع','التقييم','إنجاز المطلوب'].forEach(x=>heads.append(cell(x)));board.append(heads);group.forEach(n=>{let row=document.createElement('div');row.className='pupil';let r=n?get(n):{rec:'',eval:'',done:''};row.append(cell(n,'name'));if(r.done==='absent'||r.done==='blocked'){row.append(cell(r.done==='absent'?'غائب':'-',r.done==='blocked'?'joined dark':'joined'))}else{row.append(cell(r.rec));row.append(cell(r.eval));let status=r.done==='100'?'success':r.done==='50'?'half':r.done==='X'||r.done==='0'?'fail':'';row.append(cell(r.done==='100'?'100%':r.done==='50'?'50%':r.done==='0'?'0%':r.done==='X'?'X':'','completed '+status))}board.append(row)});area.append(board)})}
function importPaste(){const raw=document.getElementById('paste').value.trim();if(!raw)return;let lines=raw.split(/\r?\n/).map(l=>l.split('\t').map(t=>t.trim()));let count=0;for(let row of lines){let name=null;for(let v of row){let k=lookup(v);if(k){name=k;break}}if(!name)continue;let nameIndex=row.findIndex(v=>lookup(v)===name);let values=row.filter((_,i)=>i!==nameIndex);let rec=values.find(v=>v&&!/^\d+(?:[.,]\d+)?$/.test(v)&&!['ممتاز','جيد','جيد جدا','جيد جدًا','مقبول','رائع','بحاجة مراجعة'].includes(v)&&!/^\d+\s*\/\s*\d+$/.test(v)&&!/^(السبت|الأحد|الاحد|الاثنين|الثلاثاء|الاربعاء|الأربعاء|الخميس|الجمعة)$/.test(v))||'';let evaluation=values.find(v=>/^(ممتاز|جيد|جيد جدا|جيد جدًا|مقبول|رائع|بحاجة مراجعة)$/.test(v))||'';let r=get(name);r.rec=rec;r.eval=evaluation;if(/غائب/.test(rec))r.done='absent';else if(/مفصول|محروم/.test(rec))r.done='blocked';else if(/لم يسمع|انحرم/.test(rec))r.done='X';count++}renderEditors();renderPreview();document.getElementById('notice').textContent='تم التعرف على '+count+' صفًا من أسماء القالب. راجع التسميع وحدد الإنجاز يدويًا.'}
document.getElementById('import').onclick=importPaste;document.getElementById('reset').onclick=()=>{records={};renderEditors();renderPreview();document.getElementById('notice').textContent='تم تفريغ بيانات اليوم'};document.getElementById('date').onchange=renderPreview;renderEditors();renderPreview();
</script></body></html>
